name: Diagnose Windows embedded browser
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths: ['.github/workflows/ps24-windows-v35.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'build/windows-v3.5'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/windows-v3.5
      - uses: actions/download-artifact@v4
        with:
          name: PhotoSequence24-v3.5-Windows
          run-id: 37749166842
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect embedded browser
        shell: powershell
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9222
        run: |
          python -m pip install websocket-client
          $exe = Get-ChildItem "$env:RUNNER_TEMP\retest" -Recurse -Filter 'PHOTO-SEQUENCE-24-Windows-v3.5.exe' | Select-Object -First 1
          $process = Start-Process -FilePath $exe.FullName -PassThru
          try { python .build/v3.5/diagnose_browser.py } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
