name: Diagnose Windows v3.5 startup
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths: ['.github/workflows/ps24-windows-v35.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'build/windows-v3.5'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhotoSequence24-v3.5-Windows
          run-id: 37748021462
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/retest
      - name: Report packaged native startup
        shell: powershell
        run: |
          $exe = Get-ChildItem "$env:RUNNER_TEMP\retest" -Recurse -Filter 'PHOTO-SEQUENCE-24-Windows-v3.5.exe' | Select-Object -First 1
          $report = "$env:RUNNER_TEMP\native-report.json"
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--self-test','--self-test-output',('"'+$report+'"')) -PassThru
          if (!$process.WaitForExit(120000)) { $process.Kill(); throw 'Startup timed out' }
          if (Test-Path $report) { Get-Content $report -Raw } else { throw 'No report generated' }
          Write-Host "Exit code: $($process.ExitCode)"
